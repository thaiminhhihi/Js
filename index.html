<!-- Yêu cầu:


Tạo 1 ô input để nhập tên công việc.

Khi bấm nút "Thêm", công việc sẽ được hiển thị ở dưới dạng danh sách <ul>.

Mỗi mục trong danh sách có nút "Xoá" để xoá mục đó khỏi danh sách. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  ul {
    list-style-type: none;
    padding-left: 0;
  }
</style>
</head>
<body>
    <input type="text" id="job-name" placeholder="Nhập tên công việc">
    <button id="add-btn">Thêm</button>
    <ul id="job-list"></ul>
    <script src="script.js">
   
    </script>
</body>
</html>
