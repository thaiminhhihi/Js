<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- // Bài tập: Tạo 1 trang HTML với các thành phần sau:Giao diện gồm:
    // Một thẻ tiêu đề
    // Một đoạn văn có class là description:
    // Một ô nhập tên học viên
    // Một đoạn hiển thị lời chào (rỗng ban đầu)
    // Nhiệm vụ:
    // Sử dụng JavaScript để làm các việc sau:
    // Truy cập tiêu đề #main-title và thành: "Chào mừng bạn đến với khóa học JavaScript!" sử dụng innerText.
    // Truy cập đoạn mô tả có class description và thay đổi thành đoạn HTML: "Bạn sẽ học về <strong>DOM, Events</strong>" sử dụng innerHTML.
    // Khi người dùng nhập tên vào ô input và bấm nút , hiển thị lời chào trong thẻ #greeting với nội dung: "Xin chào, [tên học viên]!" -->
    <h1 id="main-title">Tiêu đề ban đầu</h1>
    <p class="description">Đoạn mô tả ban đầu</p>
    <input type="text"  id="student-name" name="student-name" placeholder="Nhập tên học viên">
    <button id="greet-button">Greet</button>
    <p id="greeting"></p>
    

    <script src="script.js"></script>
</body>

</html>
